<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16834a">
  <link rel="manifest" href="./manifest.json">
  <title>起床時間カレンダー</title>
  <style>
    :root { color-scheme: light; --green:#16834a; --line:#e5e7eb; --muted:#667085; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif; background:#f6f8f7; color:#17211b; }
    main { max-width:760px; margin:0 auto; padding:24px 16px 40px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
    h1 { font-size:22px; margin:0; }
    .header-actions { display:flex; gap:8px; flex-wrap:wrap; }
    button { border:0; border-radius:10px; padding:10px 14px; background:#e8f3ec; color:#145c36; font-weight:650; cursor:pointer; }
    button.secondary { background:#eef1f0; color:#25332a; }
    button.primary { background:var(--green); color:white; }
    button.danger { background:#fff0f0; color:#b42318; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .panel { background:white; border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:0 2px 10px #102a1608; }
    .monthbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .monthbar strong { font-size:20px; }
    .monthnav { display:flex; gap:8px; }
    .week,.calendar { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
    .week div { text-align:center; color:var(--muted); font-size:12px; padding:6px 0; }
    .day { min-height:68px; padding:7px 4px; border:1px solid #edf0ee; border-radius:11px; background:#fff; display:flex; flex-direction:column; align-items:center; gap:5px; color:#25332a; }
    .day.other { opacity:.32; }
    .day.selected { border:2px solid var(--green); background:#f0f8f3; padding:6px 3px; }
    .day.today .num { font-weight:800; text-decoration:underline; text-decoration-color:#8ab99b; }
    .num { font-size:13px; }
    .time-chip { font-size:11px; font-weight:750; color:#137443; background:#e6f4eb; border-radius:7px; padding:3px 5px; white-space:nowrap; }
    .stat-card { border:1px solid #edf0ee; background:#fafcfb; border-radius:12px; padding:12px 14px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .stat-label { font-size:13px; color:var(--muted); }
    .stat-right { display:flex; align-items:baseline; gap:8px; }
    .stat-value { font-size:18px; font-weight:750; color:#145c36; }
    .stat-sub { font-size:12px; color:var(--muted); }
    .editor { margin-top:16px; }
    .editor h2 { font-size:16px; margin:0 0 12px; }
    label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
    input[type="time"] { width:100%; font:inherit; font-size:20px; padding:11px 12px; border:1px solid #cfd8d2; border-radius:10px; background:white; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .status { min-height:22px; margin-top:10px; color:var(--muted); font-size:13px; }
    @media(max-width:420px) {
      main { padding:18px 10px 28px; }
      .panel { padding:12px; }
      .day { min-height:58px; }
      .time-chip { font-size:10px; padding:2px 3px; }
      .stat-value { font-size:16px; }
      h1 { font-size:19px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>起床時間カレンダー</h1>
    <div class="header-actions">
      <button class="secondary" id="pullSheet">スプシから取得</button>
      <button class="secondary" id="pushSheet">スプシへ送信</button>
    </div>
  </header>

  <section class="panel">
    <div class="monthbar">
      <strong id="monthLabel"></strong>
      <div class="monthnav">
        <button id="prev" aria-label="前の月">‹</button>
        <button id="today">今日</button>
        <button id="next" aria-label="次の月">›</button>
      </div>
    </div>

    <div class="stat-card" aria-label="月ごとの平均起床時間">
      <div class="stat-label" id="monthAvgLabel">今月の平均起床時間</div>
      <div class="stat-right">
        <span class="stat-value" id="monthAvgValue">--:--</span>
        <span class="stat-sub" id="monthAvgCount">記録 0日</span>
      </div>
    </div>

    <div class="week">
      <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
    </div>
    <div class="calendar" id="calendar"></div>

    <div class="editor">
      <h2 id="selectedLabel">日付を選択</h2>
      <label for="wakeTime">起床時刻</label>
      <input id="wakeTime" type="time" step="60">
      <div class="actions">
        <button class="primary" id="save">端末に保存</button>
        <button class="danger" id="remove">この日の記録を削除</button>
      </div>
      <div class="status" id="status" role="status">オフライン対応（端末内に保存されます）</div>
    </div>
  </section>
</main>

<script>
  const STORAGE_KEY = 'wake_calendar_records_v1';
  // ★ここにGASのウェブアプリURL（.../exec）を貼り付けてください
  const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyUbWAFdF4ZGxa2wAHJ30RctM52VCToiA0XF1oAc8r_u4pRM9YKa4s62uPQdSIcgvTo/exec';

  let records = {};
  let selected = new Date();
  selected = new Date(selected.getFullYear(), selected.getMonth(), selected.getDate());
  let shownMonth = new Date(selected.getFullYear(), selected.getMonth(), 1);

  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayKey = keyOf(new Date());
  const statusEl = document.getElementById('status');

  function setStatus(message, error = false) {
    statusEl.textContent = message;
    statusEl.style.color = error ? '#b42318' : '#667085';
  }

  function loadRecords() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : {};
      records = (parsed && typeof parsed === 'object') ? parsed : {};
      render();
      setStatus('端末の保存データを読み込みました（オフライン利用可）。');
    } catch (err) {
      records = {};
      render();
      setStatus('保存データの読み込みに失敗しました：' + (err.message || err), true);
    }
  }

  function persistRecords() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }

  function normalizeTime(timeStr) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(timeStr || '').trim());
    if (!m) return null;
    const h = Number(m[1]);
    const min = Number(m[2]);
    if (h < 0 || h > 23 || min < 0 || min > 59) return null;
    return `${h}:${pad(min)}`;
  }

  function calcAverage(timeList) {
    const minutes = timeList
      .map(normalizeTime)
      .filter(Boolean)
      .map(t => {
        const [h, m] = t.split(':').map(Number);
        return h * 60 + m;
      });

    if (minutes.length === 0) {
      return { text: '--:--', count: 0 };
    }

    const avg = Math.round(minutes.reduce((sum, v) => sum + v, 0) / minutes.length);
    const h = Math.floor(avg / 60) % 24;
    const m = avg % 60;
    return { text: `${h}:${pad(m)}`, count: minutes.length };
  }

  function renderMonthStats() {
    const year = shownMonth.getFullYear();
    const monthPrefix = `${year}-${pad(shownMonth.getMonth() + 1)}-`;

    const monthTimes = Object.entries(records)
      .filter(([dateKey]) => dateKey.startsWith(monthPrefix))
      .map(([, timeVal]) => timeVal);

    const monthAvg = calcAverage(monthTimes);

    document.getElementById('monthAvgLabel').textContent = `${shownMonth.getMonth() + 1}月の平均起床時間`;
    document.getElementById('monthAvgValue').textContent = monthAvg.text;
    document.getElementById('monthAvgCount').textContent = `記録 ${monthAvg.count}日`;
  }

  function render() {
    document.getElementById('monthLabel').textContent =
      `${shownMonth.getFullYear()}年${shownMonth.getMonth() + 1}月`;
    document.getElementById('selectedLabel').textContent =
      `${selected.getFullYear()}年${selected.getMonth() + 1}月${selected.getDate()}日 の起床時刻`;

    const first = new Date(shownMonth.getFullYear(), shownMonth.getMonth(), 1);
    const start = new Date(first);
    start.setDate(1 - first.getDay());
    const cal = document.getElementById('calendar');
    cal.innerHTML = '';

    for (let i = 0; i < 42; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const key = keyOf(d);
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'day' +
        (d.getMonth() !== shownMonth.getMonth() ? ' other' : '') +
        (key === keyOf(selected) ? ' selected' : '') +
        (key === todayKey ? ' today' : '');

      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = d.getDate();
      cell.appendChild(num);

      if (records[key]) {
        const chip = document.createElement('span');
        chip.className = 'time-chip';
        chip.textContent = records[key];
        cell.appendChild(chip);
      }

      cell.addEventListener('click', () => {
        selected = d;
        if (d.getMonth() !== shownMonth.getMonth()) {
          shownMonth = new Date(d.getFullYear(), d.getMonth(), 1);
        }
        render();
      });
      cal.appendChild(cell);
    }

    const existing = records[keyOf(selected)] || '';
    if (existing) {
      const [h, m] = existing.split(':');
      document.getElementById('wakeTime').value = `${pad(Number(h))}:${m}`;
    } else {
      document.getElementById('wakeTime').value = '';
    }

    renderMonthStats();
  }

  function save() {
    const rawTime = document.getElementById('wakeTime').value;
    if (!rawTime) {
      setStatus('起床時刻を入力してください。', true);
      return;
    }
    const normalized = normalizeTime(rawTime);
    if (!normalized) {
      setStatus('起床時刻を正しく入力してください。', true);
      return;
    }

    const key = keyOf(selected);
    const hadRecord = Boolean(records[key]);
    records[key] = normalized;
    persistRecords();
    render();
    setStatus(hadRecord ? '記録を更新しました。' : '記録を保存しました。');
  }

  function remove() {
    const key = keyOf(selected);
    if (!records[key]) {
      setStatus('この日の記録はありません。');
      return;
    }
    delete records[key];
    persistRecords();
    render();
    setStatus('記録を削除しました。');
  }

  function ensureGasUrl() {
    if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('ここにGASの')) {
      setStatus('先に index.html の GAS_WEB_APP_URL を設定してください。', true);
      return false;
    }
    if (!navigator.onLine) {
      setStatus('オフライン中です。ネット接続後に同期ボタンを押してください。', true);
      return false;
    }
    return true;
  }

  function setSyncBusy(busy) {
    ['pullSheet', 'pushSheet', 'save', 'remove'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.disabled = busy;
    });
  }

  async function pullFromSheet() {
    if (!ensureGasUrl()) return;
    setSyncBusy(true);
    setStatus('スプレッドシートから取得中…');
    try {
      const res = await fetch(`${GAS_WEB_APP_URL}?action=get`, { method: 'GET' });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '取得に失敗しました');

      records = data.records || {};
      persistRecords();
      render();
      setStatus('スプレッドシートから記録を取得しました。');
    } catch (err) {
      setStatus('取得エラー：' + (err.message || err), true);
    } finally {
      setSyncBusy(false);
    }
  }

  async function pushToSheet() {
    if (!ensureGasUrl()) return;
    setSyncBusy(true);
    setStatus('スプレッドシートへ送信中…');
    try {
      const res = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'sync', records })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '送信に失敗しました');

      if (data.records) {
        records = data.records;
        persistRecords();
        render();
      }
      setStatus(data.message || 'スプレッドシートへ送信しました。');
    } catch (err) {
      setStatus('送信エラー：' + (err.message || err), true);
    } finally {
      setSyncBusy(false);
    }
  }

  document.getElementById('prev').addEventListener('click', () => {
    shownMonth = new Date(shownMonth.getFullYear(), shownMonth.getMonth() - 1, 1);
    render();
  });
  document.getElementById('next').addEventListener('click', () => {
    shownMonth = new Date(shownMonth.getFullYear(), shownMonth.getMonth() + 1, 1);
    render();
  });
  document.getElementById('today').addEventListener('click', () => {
    const now = new Date();
    selected = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    shownMonth = new Date(selected.getFullYear(), selected.getMonth(), 1);
    render();
  });
  document.getElementById('save').addEventListener('click', save);
  document.getElementById('remove').addEventListener('click', remove);
  document.getElementById('pullSheet').addEventListener('click', pullFromSheet);
  document.getElementById('pushSheet').addEventListener('click', pushToSheet);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  loadRecords();
</script>
</body>
</html>
